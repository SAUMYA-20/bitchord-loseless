# Fly.io — one-time setup: fly launch --now (then fly deploy for updates, or
# wire up the GitHub Action for auto-deploy on push).
app = "bitchord-lossless"
primary_region = "sin"   # pick yours: fly platform regions

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1     # never cold — BitChord needs an always-on source

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[env]
  SOURCES = "tidal,archive,gdstudio"
  PORT = "8787"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
